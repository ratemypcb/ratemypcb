[workspace]
members = ["crates/ratemypcb-core", "crates/ratemypcb-cli"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/ratemypcb/ratemypcb"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "4", default-features = false, features = ["deflate"] }
getrandom = "0.3"
sha2 = "0.10"

[profile.test.package.ratemypcb-core]
opt-level = 2
